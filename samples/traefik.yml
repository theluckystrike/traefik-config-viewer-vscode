api:
  dashboard: true
  insecure: true

serversTransport:
  insecureSkipVerify: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

certificatesResolvers:
  letsencrypt:
    acme:
      email: "ops@example.com"
      storage: "/etc/traefik/acme.json"
      httpChallenge:
        entryPoint: web

http:
  routers:
    api_router:
      rule: "Host(`api.example.com`)"
      entryPoints:
        - websecure
      middlewares:
        - admin_auth
      service: api_svc
      tls:
        certResolver: letsencrypt
    dashboard_router:
      rule: "Host(`traefik.example.com`)"
      entryPoints:
        - websecure
      service: api@internal
      tls:
        certResolver: letsencrypt
    legacy_router:
      rule: "Host(`old.example.com`)"
      entryPoints:
        - web
      service: missing_svc

  middlewares:
    admin_auth:
      basicAuth:
        users:
          - "admin:example_plain_pass"

  services:
    api_svc:
      loadBalancer:
        passHostHeader: true
        healthCheck:
          path: "/healthz"
        servers:
          - url: "https://10.0.1.10:8443"
          - url: "https://10.0.1.11:8443"

tcp:
  routers:
    db_router:
      rule: "HostSNI(`db.example.com`)"
      entryPoints:
        - websecure
      service: db_svc
      tls:
        certResolver: letsencrypt
  services:
    db_svc:
      loadBalancer:
        servers:
          - address: "10.0.2.20:5432"
